name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The control core, on its own, with the warnings turned up.
  # ---------------------------------------------------------------------------
  cpp:
    name: C++ (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DODC_BUILD_TESTS=ON
          -DODC_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Undefined behaviour and memory errors. The control path claims to be
  # allocation-free and deterministic; sanitizers are how that claim is kept
  # honest rather than aspirational.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        san: [address, undefined]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DODC_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.san }} -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.san }}"
      - run: cmake --build build -j
      - run: ./build/odc_tests
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1

  # ---------------------------------------------------------------------------
  # Bindings, Python tests, and the closed-loop acceptance gates.
  # ---------------------------------------------------------------------------
  simulation:
    name: SIL scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install numpy matplotlib pytest pybind11

      - name: Build with bindings
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DODC_BUILD_PYTHON=ON -DODC_BUILD_TESTS=OFF \
            -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
          cmake --build build -j
          cp build/omni_drive_core*.so python/

      - name: Python tests
        run: python -m pytest tests/ -q

      # Every scenario carries numeric acceptance criteria, so a control
      # regression fails the build exactly like a failing unit test would.
      # Multiple seeds because gates tuned on one noise realisation are gates
      # that pass by luck.
      - name: Acceptance gates
        run: python tools/run_scenarios.py --seeds 8 --no-color --json artifacts/scenarios.json

      - name: Plots
        run: python tools/plot_scenarios.py --out artifacts/img

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-report
          path: artifacts/

  # ---------------------------------------------------------------------------
  # The ROS 2 wrapper. Separate job because it needs a ROS environment, and
  # because the core deliberately does not depend on one.
  # ---------------------------------------------------------------------------
  ros2:
    name: ROS 2 Jazzy
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src_repo

      - name: Build package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd src_repo/ros2_ws
          colcon build --event-handlers console_direct+

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check python tools tests
      - name: clang-format
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find cpp bindings ros2_ws -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
